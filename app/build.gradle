plugins {
    alias(libs.plugins.android.application)
    // Coverage of the JVM unit tests: the jacocoTestReport and jacocoMatchingCoverageVerification tasks below
    id 'jacoco'
}

// The version follows the release tag: .github/workflows/release.yml builds a tag such as v0.1.0 with
// -PversionName=0.1.0 -PversionCode=100. Local builds, CI and Android Studio use these defaults.
def appVersionName = (project.findProperty('versionName') ?: '0.0.0-dev').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString()
if (!appVersionCode.isInteger() || appVersionCode.toInteger() < 1) {
    throw new GradleException("versionCode must be a positive whole number, was '${appVersionCode}'")
}

android {
    namespace 'com.btk.spm'
    compileSdk 35

    defaultConfig {
        applicationId "com.btk.spm"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode.toInteger()
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                // Room writes each schema version as JSON under app/schemas/, committed: the report's
                // ER diagram is drawn from it (Issue 34) and a future migration test reads it
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            // Nothing to hide and stack traces in the report stay readable
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // No release key and no Play Store (brief 3.3): the debug keystore signs the release APK,
            // so it installs from a file and replaces a debug build signed on the same machine
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        // Java 17: the level AGP 8+ and Android Studio support without desugaring tricks (brief 3.1, Java not Kotlin)
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        // Every layout is bound through its generated binding class; no findViewById in screens
        viewBinding true
        // BuildConfig.DEBUG gates the lifecycle log (Issue 3); AGP 8+ no longer generates it by default
        buildConfig true
    }
    sourceSets {
        // JVM tests read the real seed asset (recipes.json) as a resource, never a copy that can
        // drift from what the app ships (Issue 11; Issue 21's engine tests read it too)
        test {
            resources.srcDirs += 'src/main/assets'
        }
    }
    testOptions {
        unitTests {
            // JVM tests can read strings.xml and other resources without an emulator
            includeAndroidResources = true
        }
        // The instrumentation runner turns animations off for its own run (Issue 32). It does not
        // change the emulator's three animation scales; scripts/ci-local.sh --with-device does that.
        animationsDisabled = true
    }
    lint {
        // Every visible string lives in strings.xml (Issue 2): a typed android:text, android:hint or
        // contentDescription in a layout (HardcodedText), or a literal passed to setText() in Java
        // (SetTextI18n), fails the build instead of warning. So does an ImageView or ImageButton with
        // no contentDescription and no importantForAccessibility="no" (ContentDescription, Issue 30):
        // a screen reader would announce it as "unlabelled".
        error += ['HardcodedText', 'SetTextI18n', 'ContentDescription']
        abortOnError = true
        // Warnings are reported, not fatal: an accepted one is suppressed in lint.xml with its reason
        warningsAsErrors = false
        lintConfig = file('lint.xml')
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.fragment
    implementation libs.constraintlayout
    implementation libs.recyclerview
    // The Settings screen (Issue 28): PreferenceFragmentCompat persists, summarises and themes each
    // preference, so the Java left to write is the keys and the typed wrapper around them
    implementation libs.preference
    // The daily expiring-soon check (Issue 29): a Worker WorkManager runs about once a day, with no
    // exact alarm and no foreground service, and it survives a reboot on its own
    implementation libs.work.runtime

    // Room over SQLite (decision 1). The app is Java, so the compiler runs through annotationProcessor:
    // never kapt or ksp, which would need the Kotlin plugin (decision 2)
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler
    implementation libs.lifecycle.livedata
    implementation libs.lifecycle.viewmodel

    testImplementation libs.junit
    testImplementation libs.org.json
    // InstantTaskExecutorRule and ArchTaskExecutor, so the ViewModels' LiveData runs in JVM tests (Issue 23)
    testImplementation libs.arch.core.testing

    // Declared here once (Issue 8) so the DAO tests of Issues 9 and 10 do not both edit this file
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.arch.core.testing
    androidTestImplementation libs.room.testing
    androidTestImplementation libs.espresso.core
    // The Accessibility Test Framework, the checks Accessibility Scanner runs, on every Espresso action (Issue 30)
    androidTestImplementation libs.espresso.accessibility
    // The flows the video shows, through the real screens (Issue 32): RecyclerViewActions for the
    // lists, and an IdlingThreadPoolExecutor so Espresso waits for Room and the matcher, never a sleep
    androidTestImplementation libs.espresso.contrib
    androidTestImplementation libs.espresso.idling.concurrent
    // WorkManagerTestInitHelper, TestWorkerBuilder and TestDriver: the worker runs in the test, now
    androidTestImplementation libs.work.testing
}

// Coverage of the JVM unit tests (Issue 21). The jacoco plugin puts its agent on testDebugUnitTest;
// these two tasks read what it recorded against the debug build's compiled classes.
jacoco {
    toolVersion = libs.versions.jacoco.get()
}

tasks.withType(Test).configureEach {
    // The JDK's own classes are never ours to measure, and instrumenting them only produces warnings
    jacoco.excludes = ['jdk.internal.*']
    // ConventionsTest also reads the instrumented tests as text (no sleeping, Issue 32). Declared as
    // inputs, so a change there runs the unit tests again instead of finding them up to date.
    inputs.dir('src/androidTest/java').withPathSensitivity(PathSensitivity.RELATIVE).withPropertyName('androidTestSources')
}

def unitTestCoverageData = layout.buildDirectory.file('jacoco/testDebugUnitTest.exec')
def debugJavaClasses = layout.buildDirectory.dir('intermediates/javac/debug/compileDebugJavaWithJavac/classes')

// HTML and XML under app/build/reports/jacoco/jacocoTestReport/, for the whole app minus generated code
tasks.register('jacocoTestReport', JacocoReport) {
    group = 'verification'
    description = 'Writes the line and branch coverage of the debug unit tests.'
    dependsOn 'testDebugUnitTest'
    executionData.from(unitTestCoverageData)
    sourceDirectories.from('src/main/java')
    classDirectories.from(debugJavaClasses.map { dir ->
        fileTree(dir) {
            exclude '**/R.class', '**/R$*.class', '**/BuildConfig.class', '**/Manifest*.class',
                    '**/databinding/**', '**/*_Impl*.class'
        }
    })
    reports {
        html.required = true
        xml.required = true
    }
}

// Strict-matching rule 8: every line of the engine is run by a test. Fails the gate's coverage stage
// naming the class that falls short.
tasks.register('jacocoMatchingCoverageVerification', JacocoCoverageVerification) {
    group = 'verification'
    description = 'Fails unless the unit tests cover every line of domain/matching/.'
    dependsOn 'testDebugUnitTest'
    executionData.from(unitTestCoverageData)
    sourceDirectories.from('src/main/java')
    classDirectories.from(debugJavaClasses.map { dir ->
        fileTree(dir) { include 'com/btk/spm/domain/matching/**' }
    })
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}
