plugins {
    alias(libs.plugins.android.application)
}

// The version follows the release tag: .github/workflows/release.yml builds a tag such as v0.1.0 with
// -PversionName=0.1.0 -PversionCode=100. Local builds, CI and Android Studio use these defaults.
def appVersionName = (project.findProperty('versionName') ?: '0.0.0-dev').toString()
def appVersionCode = (project.findProperty('versionCode') ?: '1').toString()
if (!appVersionCode.isInteger() || appVersionCode.toInteger() < 1) {
    throw new GradleException("versionCode must be a positive whole number, was '${appVersionCode}'")
}

android {
    namespace 'com.btk.spm'
    compileSdk 35

    defaultConfig {
        applicationId "com.btk.spm"
        minSdk 26
        targetSdk 35
        versionCode appVersionCode.toInteger()
        versionName appVersionName

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        // Java 17: the level AGP 8+ and Android Studio support without desugaring tricks (brief 3.1, Java not Kotlin)
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        // Every layout is bound through its generated binding class; no findViewById in screens
        viewBinding true
        // BuildConfig.DEBUG gates the lifecycle log (Issue 3); AGP 8+ no longer generates it by default
        buildConfig true
    }
    testOptions {
        unitTests {
            // JVM tests can read strings.xml and other resources without an emulator
            includeAndroidResources = true
        }
    }
    lint {
        // Every visible string lives in strings.xml (Issue 2): a typed android:text, android:hint or
        // contentDescription in a layout (HardcodedText), or a literal passed to setText() in Java
        // (SetTextI18n), fails the build instead of warning.
        error += ['HardcodedText', 'SetTextI18n']
        abortOnError = true
        // Warnings are reported, not fatal: an accepted one is suppressed in lint.xml with its reason
        warningsAsErrors = false
        lintConfig = file('lint.xml')
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.fragment
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
