[versions]
agp = "9.4.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
# activity 1.11 and later require compileSdk 36; 1.10.1 is the last release for compileSdk 35 (decision 4)
activity = "1.10.1"
constraintlayout = "2.2.2"
fragment = "1.9.1"
# Declared, not left to Material's transitive 1.2.1: the pantry list (Issue 13) is built on ListAdapter
recyclerview = "1.4.0"
# Room 2.6, as the plan pins it (decision 1); its compiler runs as a plain Java annotation processor
room = "2.6.1"
# 2.10.0 is what Material 1.14 and fragment 1.9 resolve to. Not 2.11.0: its LiveData carries Kotlin 2.1
# metadata, which Room 2.6.1's processor cannot read, so any @Transaction DAO method fails to compile
lifecycle = "2.10.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
archCoreTesting = "2.2.0"
# The real org.json for JVM tests: android.jar only has stubs that throw "not mocked"
orgJson = "20260814"
# Line coverage of the unit tests (Issue 21). 0.8.15 reads the Java 25 class files of the JetBrains
# runtime the tests run on; Gradle's bundled default is older
jacoco = "0.8.15"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { group = "androidx.test", name = "rules", version.ref = "androidxTestRules" }
arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCoreTesting" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
