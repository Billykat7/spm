# CI: the local gate, run by GitHub (Issue 4).
#
# Runs ./scripts/ci-local.sh, the same script every contributor runs before pushing: the scope
# guards (no Kotlin, no maps, location or billing), Android Lint, the JVM unit tests and the debug
# build. Its job, "gate", is the status check the "Protect main" ruleset requires before a pull
# request can merge. Instrumented tests need an emulator and run locally with --with-device.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow only reads the repository; the artifact upload needs no extra scope.
permissions:
  contents: read

# A new push to a pull request cancels its older run; runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Starts the Gradle wrapper. Gradle itself then runs on the JetBrains Runtime 25 that
      # gradle/gradle-daemon-jvm.properties asks for, provisioned through the foojay resolver.
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Caches dependencies, wrapper and provisioned JDKs between runs; validates the wrapper jar.
      # "basic" is the MIT-licensed provider built on actions/cache.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run the gate (guards, lint, unit tests, debug build)
        run: ./scripts/ci-local.sh

      # Uploaded whatever the gate's outcome, so a lint failure can be read from the run page.
      - name: Upload the lint report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 30
